name: Go CI/CD

on:
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    uses: Desmondgoldsmith/github-actions-shared/.github/workflows/go-aks-cicd.yml@main

    with:
      aks-cluster: rest-go-aks
      aks-resource-group: devops-aks-lab-rg-sa
      acr-name: dessydevopsacr
      helm-release: go-rest-api
      helm-chart-path: ./helm
      namespace: go-rest-api
      go-version: '1.27'

    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
